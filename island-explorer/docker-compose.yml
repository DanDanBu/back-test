version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: island-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: island_explorer

  api:
    build: .
    container_name: island-api
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB: island_explorer
      JWT_SECRET: change-me-in-production
      PORT: 8080
    depends_on:
      - mongodb

volumes:
  mongo_data:
